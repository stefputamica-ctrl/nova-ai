<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report a Nova answer</title><meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;--bg:#070a14;--ink:#eef1f8;--dim:#9aa3bd;--sun:#ffb627;--edge:rgba(255,255,255,.16)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
.box{max-width:520px;width:100%;border:1px solid var(--edge);border-radius:24px;padding:24px;background:rgba(28,32,46,.6)}
h1{font-size:22px;margin:0 0 8px}p{color:var(--dim);margin:0 0 16px}
a.btn{display:inline-block;padding:11px 20px;border-radius:999px;background:var(--sun);color:#15181f;font-weight:700;text-decoration:none}
[hidden]{display:none!important}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--dim);border:1px solid var(--edge);border-radius:14px;padding:12px;max-height:240px;overflow:auto;margin:16px 0 0}
</style></head><body><main class="box">
<h1>Report a Nova answer</h1>
<p>Your email app should open with the report ready. Just press Send. If it didn’t open, use the button.</p>
<a class="btn" id="go" href="#">Open email</a>
<pre id="txt" hidden></pre>
</main>
<script>
(function(){
  var u="";try{u=decodeURIComponent(location.hash.slice(1))}catch(e){}
  if(!/^mailto:stefputamica@gmail\.com\?/.test(u)){document.querySelector("p").textContent="This report link is incomplete. Use the Report button in Nova again.";document.getElementById("go").hidden=true;return}
  document.getElementById("go").href=u;
  try{var b=new URLSearchParams(u.split("?")[1]).get("body");if(b){var t=document.getElementById("txt");t.textContent=b;t.hidden=false}}catch(e){}
  setTimeout(function(){location.href=u},300);
})();
</script></body></html>
